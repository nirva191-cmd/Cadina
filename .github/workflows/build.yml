name: Compilar APK con Buildozer

on:
  push:
    branches: [ main, master, principal ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

    - name: Instalar Buildozer y Cython
      run: |
        pip install --upgrade pip
        pip install cython==0.29.36 buildozer

    - name: Compilar APK con Buildozer
      run: |
        buildozer -v android debug

    - name: Buscar y renombrar APK generada
      run: |
        mkdir -p build_output
        find bin/ -name "*.apk" -exec cp {} build_output/app-debug.apk \;

    - name: Subir APK como artefacto
      uses: actions/upload-artifact@v4
      with:
        name: app-android-debug
        path: build_output/*.apk
        
